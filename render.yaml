services:
  - type: web
    name: guardianai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HEALTH_CHECK_TOKEN
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://watchful-essence-ai.lovable.app,https://id-preview--13cc838c-640e-4c9a-8c40-0315d9c3b362.lovable.app
      - key: LOVABLE_API_KEY
        sync: false
      - key: GATEWAYAPI_API_KEY
        sync: false
      - key: SMS_SENDER
        value: GuardianAI
