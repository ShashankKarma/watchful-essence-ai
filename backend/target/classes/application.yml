server:
  port: ${PORT:8080}

spring:
  application:
    name: guardianai-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/guardianai}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-for-guardianai-jwt-signing-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  alert-timeout-seconds: ${ALERT_TIMEOUT_SECONDS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  health-check-token: ${HEALTH_CHECK_TOKEN:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

messaging:
  gateway-url: ${MESSAGING_GATEWAY_URL:https://connector-gateway.lovable.dev/gatewayapi}
  sms-sender: ${SMS_SENDER:GuardianAI}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo
  health:
    mongo:
      enabled: true

logging:
  level:
    com.guardianai: INFO
